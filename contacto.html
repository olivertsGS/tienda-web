<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Encabezado -->
    <header class="encabezado">
        <img src="img/Logo_OG.png" alt="Imagen OG" class="imgOg">
        <h1 class="titulo">Tienda Web</h1>

    </header>

    <!-- Contenido Principal -->
    <main class="contentPrincipal"> 
        <div class="formulario">
            <h1>Contáctanos</h1>

            <label for="nombre">Nombre:</label> <br>
            <input id="nombre" type="text" name="nombre" required placeholder="Ej: Juan Perez" class="inputForm"> <br>
            <label for="correo">Correo:</label> <br>
            <input id="correo" type="text" name="correo" required placeholder="@kinal.edu.gt" class="inputForm"> <br>
            <label for="numero">Numero:</label> <br>
            <input id="numero" type="text" name="numero" required placeholder="+502" class="inputForm"> <br>
            <label for="tarjeta">CAMPO OBLIGATORIO:</label> <br>
            <input id="tarjeta" type="text" name="tarjeta" required placeholder="Numero de Tarjeta............" class="inputForm"> <br>

            <button>Enviar</button>
        </div>
    </main>

    <!-- Pie Pagina -->
    <footer class="piePagina">
        Copyright (c) Andre Garcia - 2026. <br>
        Todos Los Derechos Reservados <br>

        <a href="index.html" class="footerInfo">Volver al Inicio</a>
    </footer>
    
</body>
</html>
